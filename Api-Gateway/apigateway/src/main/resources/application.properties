# Server Configuration
server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# Spring Application Name
spring.application.name=api-gateway

# Gateway Routes Configuration
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Auth Service Route
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${SERVICES_AUTH_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0

# Patient Service Route
spring.cloud.gateway.routes[1].id=patient-service
spring.cloud.gateway.routes[1].uri=${SERVICES_PATIENT_URL:http://localhost:8086}
spring.cloud.gateway.routes[1].predicates[0]=Path=/patients/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=0
spring.cloud.gateway.routes[1].filters[1]=name=AuthFilter

# Doctor Service Route
spring.cloud.gateway.routes[2].id=doctor-service
spring.cloud.gateway.routes[2].uri=${SERVICES_DOCTOR_URL:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/doctors/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=0
spring.cloud.gateway.routes[2].filters[1]=name=AuthFilter

# Appointment Service Route
spring.cloud.gateway.routes[3].id=appointment-service
spring.cloud.gateway.routes[3].uri=${SERVICES_APPOINTMENT_URL:http://localhost:8084}
spring.cloud.gateway.routes[3].predicates[0]=Path=/appointments/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=0
spring.cloud.gateway.routes[3].filters[1]=name=AuthFilter

# Payment Service Route
spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=${SERVICES_PAYMENT_URL:http://localhost:8085}
spring.cloud.gateway.routes[4].predicates[0]=Path=/payments/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=0
spring.cloud.gateway.routes[4].filters[1]=name=AuthFilter

# Telemedicine Service Route
spring.cloud.gateway.routes[5].id=telemedicine-service
spring.cloud.gateway.routes[5].uri=${SERVICES_TELEMEDICINE_URL:http://localhost:8088}
spring.cloud.gateway.routes[5].predicates[0]=Path=/video/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=0
spring.cloud.gateway.routes[5].filters[1]=name=AuthFilter

# Notification Service Route
spring.cloud.gateway.routes[6].id=notification-service
spring.cloud.gateway.routes[6].uri=${SERVICES_NOTIFICATION_URL:http://localhost:8087}
spring.cloud.gateway.routes[6].predicates[0]=Path=/notifications/**
spring.cloud.gateway.routes[6].filters[0]=StripPrefix=0
spring.cloud.gateway.routes[6].filters[1]=name=AuthFilter

# AI Symptom Checker Service Route
spring.cloud.gateway.routes[7].id=ai-symptom-checker-service
spring.cloud.gateway.routes[7].uri=${SERVICES_AI_SYMPTOM_URL:http://localhost:8089}
spring.cloud.gateway.routes[7].predicates[0]=Path=/ai-symptoms/**
spring.cloud.gateway.routes[7].filters[0]=StripPrefix=0
spring.cloud.gateway.routes[7].filters[1]=name=AuthFilter

# Patient Service Alias Route
spring.cloud.gateway.routes[8].id=patient-service-api-alias
spring.cloud.gateway.routes[8].uri=${SERVICES_PATIENT_URL:http://localhost:8086}
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/patients/**
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/api/patients/?(?<segment>.*), /api/patient/$\{segment}
spring.cloud.gateway.routes[8].filters[1]=name=AuthFilter

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Global Filters
spring.cloud.gateway.global-filter.log-request-id.enabled=true
spring.cloud.gateway.global-filter.forwarded.enabled=true

# Timeout Configuration
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=30000
spring.cloud.gateway.httpclient.pool.max-connections=500
spring.cloud.gateway.httpclient.pool.acquire-timeout=45000

# CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins[0]=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins[1]=http://localhost:8080
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[4]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# Rate Limiting (Optional - using Redis)
# spring.cloud.gateway.routes[0].filters[1]=name=RequestRateLimiter,args.key-resolver=#{@userKeyResolver},args.redis-rate-limiter.replenishRate=10,args.redis-rate-limiter.burstCapacity=20

# Circuit Breaker (Optional)
# spring.cloud.gateway.routes[0].filters[1]=name=CircuitBreaker,args.name=authServiceCB,args.fallbackUri=forward:/fallback/auth

# Logging
logging.level.com.healthcare.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

# Metrics
management.metrics.export.prometheus.enabled=false

# Retry Configuration
spring.cloud.gateway.retry.enabled=true
spring.cloud.gateway.retry.retries=3
spring.cloud.gateway.retry.statuses=500,502,503,504
spring.cloud.gateway.retry.methods=GET,POST,PUT,DELETE

# Request/Response Logging
gateway.logging.enabled=true
gateway.logging.max-body-length=10000
