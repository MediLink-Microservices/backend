# Server Configuration
server.port=8084
server.servlet.context-path=/
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# Spring Application Name
spring.application.name=appointment-service

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27020
spring.data.mongodb.database=appointment_db
spring.data.mongodb.authentication-database=admin

# MongoDB Transaction (if needed)
spring.data.mongodb.transaction-manager=true

# Service URLs
services.doctor.url=http://localhost:8083
services.patient.url=http://localhost:8082
services.payment.url=http://localhost:8085
services.telemedicine.url=http://localhost:8086
services.notification.url=http://localhost:8087
services.auth.url=http://localhost:8081

# WebClient Configuration
webclient.max-in-memory-size=1048576
webclient.response-timeout=30000

# Business Rules
appointment.minimum-cancellation-hours=2
appointment.advance-booking-days=30
appointment.default-status=PENDING
appointment.allowed-statuses=SCHEDULED,CONFIRMED,IN_PROGRESS,COMPLETED,CANCELLED,NO_SHOW

# Payment Configuration
payment.required=true
payment.timeout-minutes=15

# Video Consultation
video.room-expiry-minutes=60
video.provider=jitsi
video.jitsi.server-url=https://meet.jit.si

# Logging
logging.level.com.healthcare.appointment=DEBUG
logging.level.org.springframework.web.reactive.function.client=DEBUG
logging.pattern.file=logs/appointment-service.%d{yyyy-MM-dd}.log
logging.file.max-size=10MB
logging.file.max-history=30

# Scheduling (for appointment reminders)
spring.task.scheduling.pool.size=5
appointment.reminder.cron=0 0 8 * * *

# Thread Pool Configuration
appointment.threads.core=10
appointment.threads.max=50
appointment.threads.queue-capacity=100

# Validation
spring.mvc.validation.enabled=true

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.serialization.fail-on-empty-beans=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.appointment-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.appointment-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.appointment-service.failure-rate-threshold=50
resilience4j.retry.instances.appointment-service.max-attempts=3
resilience4j.retry.instances.appointment-service.wait-duration=1000