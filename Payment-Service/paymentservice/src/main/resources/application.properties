# Server Configuration
server.port=8085
server.servlet.context-path=/
server.error.include-stacktrace=never
server.error.include-exception=false

# Spring Application Name
spring.application.name=payment-service

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27021
spring.data.mongodb.database=payment_db
spring.data.mongodb.authentication-database=admin

# Payment Gateway Configuration
payment.gateway.provider=stripe
payment.gateway.api-key=pk_test_your_stripe_key
payment.gateway.secret-key=sk_test_your_stripe_secret
payment.gateway.webhook-secret=whsec_your_webhook_secret

# Alternative: Razorpay Configuration
# payment.gateway.razorpay.key-id=rzp_test_your_key
# payment.gateway.razorpay.key-secret=your_secret

# PayPal Configuration
# payment.gateway.paypal.client-id=your_client_id
# payment.gateway.paypal.client-secret=your_secret
# payment.gateway.paypal.mode=sandbox

# Business Rules
payment.currency=USD
payment.tax-percentage=18
payment.convenience-fee=50
payment.minimum-amount=100
payment.maximum-amount=50000

# Payment Methods
payment.methods=CREDIT_CARD,DEBIT_CARD,UPI,NET_BANKING,WALLET

# Idempotency (to prevent duplicate payments)
payment.idempotency-key.enabled=true
payment.idempotency-key.ttl-minutes=30

# Logging
logging.level.com.healthcare.payment=DEBUG
logging.level.com.stripe=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%-5level] %logger{15} - %msg%n

# Service URLs
services.appointment.url=http://localhost:8084
services.notification.url=http://localhost:8087
services.auth.url=http://localhost:8081

# Webhook Configuration
payment.webhook.endpoint=/api/payments/webhook
payment.webhook.secret=your_webhook_secret_here

# Validation
spring.mvc.validation.enabled=true

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Transaction Configuration
payment.transaction.timeout-seconds=30
payment.retry.max-attempts=3
payment.retry.delay-seconds=5