# Server Configuration
server.port=8083
server.servlet.context-path=/
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml

# Spring Application Name
spring.application.name=doctor-service

# MongoDB Configuration
spring.data.mongodb.uri=mongodb+srv://newhasaranga2002_db_user:WnfA1npol3E0DRBn@cluster0.pld4jxk.mongodb.net/doctor_db

# MongoDB Auto-Index Creation
spring.data.mongodb.auto-index-creation=true

# Logging
logging.level.com.healthcare.doctor=DEBUG
logging.level.org.springframework.data.mongodb.core=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Service URLs
services.auth.url=http://localhost:8081
services.patient.url=http://localhost:8082
services.appointment.url=http://localhost:8084

# Business Configuration
doctor.schedule.default-start-time=09:00
doctor.schedule.default-end-time=17:00
doctor.schedule.slot-duration-minutes=30
doctor.max-appointments-per-day=20

# Validation
spring.mvc.validation.enabled=true

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true

# CORS
cors.allowed-origins=*