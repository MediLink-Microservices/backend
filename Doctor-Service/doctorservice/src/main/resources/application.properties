# Server Configuration
server.port=8083
server.servlet.context-path=/
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml

# Spring Application Name
spring.application.name=doctor-service
spring.main.allow-bean-definition-overriding=true

# MongoDB Configuration
spring.data.mongodb.uri=mongodb+srv://newhasaranga2002_db_user:WnfA1npol3E0DRBn@cluster0.pld4jxk.mongodb.net/doctor_db
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.database=doctor_db

# Disable auto-configuration to prevent localhost connection
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.embedded.EmbeddedMongoAutoConfiguration

# Logging
logging.level.com.medilink.doctorservice=DEBUG
logging.level.org.springframework.data.mongodb.core=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Service URLs
services.auth.url=http://localhost:8081
services.patient.url=http://localhost:8086
services.appointment.url=http://localhost:8084

# Business Configuration
doctor.schedule.default-start-time=09:00
doctor.schedule.default-end-time=17:00
doctor.schedule.slot-duration-minutes=30
doctor.max-appointments-per-day=20

# Validation
spring.mvc.validation.enabled=true

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true

# CORS
cors.allowed-origins=*