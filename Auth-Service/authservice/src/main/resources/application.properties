# Server Configuration
server.port=8081
server.servlet.context-path=/

# Spring Application Name
spring.application.name=auth-service

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=auth_db
spring.data.mongodb.authentication-database=admin

# MongoDB Connection Pool
spring.data.mongodb.connections-per-host=100
spring.data.mongodb.threads-allowed-to-block-for-connection-multiplier=5

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Logging
logging.level.com.healthcare.auth=DEBUG
logging.level.org.springframework.data.mongodb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Security
spring.security.user.name=admin
spring.security.user.password=admin123

# Validation
spring.mvc.validation.enabled=true

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Actuator (Optional)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always