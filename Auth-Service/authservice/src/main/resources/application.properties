# Server Configuration
server.port=8081
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# Spring Application Name
spring.application.name=auth-service

# MongoDB Configuration
spring.data.mongodb.uri=mongodb+srv://ayeshaarachchigeh_db_user:YTbZRGxW4QoQWPmB@cluster0.aigqlqy.mongodb.net/auth_db?retryWrites=true&w=majority&appName=Cluster0
spring.data.mongodb.auto-index-creation=true

# MongoDB Connection Pool (Modern Properties)
spring.data.mongodb.min-connections-per-host=0
spring.data.mongodb.max-connections-per-host=100
spring.data.mongodb.connect-timeout=10000
spring.data.mongodb.socket-timeout=10000


# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.header=Authorization
jwt.prefix=Bearer 

# Logging
logging.level.com.medilink.authservice=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/auth-service.log
logging.file.max-size=10MB
logging.file.max-history=30

# Security
spring.security.user.name=admin@medilink.com
spring.security.user.password=Admin@123

# Validation
spring.mvc.validation.enabled=true

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.fail-on-empty-beans=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.metrics.export.prometheus.enabled=false

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*,Authorization,Content-Type
cors.allow-credentials=true
cors.max-age=3600

# Redis Configuration (for token blacklist - optional)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Thread Pool Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=25
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=auth-task-

# Scheduling
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=auth-scheduler-

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# Error Handling
server.error.include-stacktrace=never
server.error.include-exception=false

# Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

