# Docker-specific configuration
spring.data.mongodb.host=mongo-auth
spring.data.mongodb.port=27017

# Redis for Docker
spring.data.redis.host=redis-auth
spring.data.redis.port=6379

# Service URLs for Docker
services.auth.url=http://auth-service:8081
services.patient.url=http://patient-service:8082
services.doctor.url=http://doctor-service:8083