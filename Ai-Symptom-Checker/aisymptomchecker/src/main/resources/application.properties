# Server Configuration
server.port=8088
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100

# Spring Application Name
spring.application.name=ai-symptom-checker-service

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27024
spring.data.mongodb.database=ai_symptom_db
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.auto-index-creation=true

# MongoDB Connection Pool
spring.data.mongodb.connections-per-host=50
spring.data.mongodb.threads-allowed-to-block-for-connection-multiplier=5
spring.data.mongodb.socket-keep-alive=true
spring.data.mongodb.socket-timeout=5000
spring.data.mongodb.connect-timeout=5000
spring.data.mongodb.server-selection-timeout=5000

# AI Model Configuration
ai.model.type=rule-based
ai.model.version=1.0.0
ai.model.path=/models/symptom-checker-model.bin
ai.model.confidence-threshold=0.65

# Alternative: OpenAI GPT Integration (if using)
# openai.api.key=sk-proj-your-openai-api-key
# openai.model=gpt-3.5-turbo
# openai.max-tokens=500
# openai.temperature=0.7
# openai.api.url=https://api.openai.com/v1/chat/completions

# Alternative: TensorFlow Integration
# tensorflow.model.path=/models/symptom-checker.pb
# tensorflow.input.name=input_tensor
# tensorflow.output.name=output_tensor
# tensorflow.saved-model.tags=serve

# Alternative: Custom ML Model (ONNX Runtime)
# onnx.model.path=/models/symptom-checker.onnx
# onnx.preferred-backends=CUDA,CPU
# onnx.thread-pool-size=4

# Symptom Database Configuration
symptom.database.conditions-path=/data/conditions.json
symptom.database.symptoms-path=/data/symptoms.json
symptom.database.medications-path=/data/medications.json

# Business Rules
ai.recommendation.max-conditions=5
ai.recommendation.min-symptoms=1
ai.recommendation.include-specialist-referral=true
ai.recommendation.include-home-remedies=true
ai.recommendation.include-otc-medications=false
ai.recommendation.emergency-threshold=0.85

# Severity Levels
ai.severity.mild-threshold=0.3
ai.severity.moderate-threshold=0.6
ai.severity.severe-threshold=0.8
ai.severity.critical-threshold=0.95

# Common Conditions Mapping
ai.conditions.common-cold.keywords=cough,sneezing,runny nose,sore throat
ai.conditions.flu.keywords=fever,body ache,chills,fatigue
ai.conditions.covid.keywords=fever,dry cough,loss of taste,breathing difficulty
ai.conditions.migraine.keywords=severe headache,nausea,sensitivity to light
ai.conditions.gastroenteritis.keywords=vomiting,diarrhea,stomach pain,nausea
ai.conditions.urinary-infection.keywords=burning urination,frequent urination,lower abdominal pain
ai.conditions.allergy.keywords=sneezing,itchy eyes,skin rash,runny nose
ai.conditions.hypertension.keywords=headache,blurred vision,chest pain,shortness of breath
ai.conditions.diabetes.keywords=excessive thirst,frequent urination,weight loss,fatigue
ai.conditions.anxiety.keywords=racing heart,sweating,trembling,restlessness

# Emergency Symptoms (Triggers immediate medical attention)
ai.emergency.symptoms=chest pain,severe bleeding,difficulty breathing,unconsciousness,seizure,stroke symptoms,suicidal thoughts,severe allergic reaction

# Specialist Referral Mapping
ai.referral.cardiologist.symptoms=chest pain,irregular heartbeat,high blood pressure
ai.referral.neurologist.symptoms=severe headache,seizure,memory loss,tremor
ai.referral.dermatologist.symptoms=skin rash,moles change,hair loss
ai.referral.gastroenterologist.symptoms=stomach pain,acid reflux,digestive issues
ai.referral.orthopedist.symptoms=joint pain,back pain,bone fracture
ai.referral.psychiatrist.symptoms=depression,anxiety,insomnia,mood swings
ai.referral.ENT.symptoms=ear pain,sinusitis,hearing loss
ai.referral.ophthalmologist.symptoms=vision problems,eye pain,redness
ai.referral.urologist.symptoms=urinary problems,kidney pain
ai.referral.gynecologist.symptoms=menstrual issues,pelvic pain

# OTC Medication Suggestions
ai.medications.pain-relievers=paracetamol,ibuprofen
ai.medications.cold-remedies=cetirizine,loratadine
ai.medications.antacids=omeprazole,ranitidine
ai.medications.antihistamines=fexofenadine,levocetirizine

# Home Remedies Database
ai.remedies.sore-throat=salt water gargle,honey tea,warm water
ai.remedies.cough=ginger tea,tulsi leaves,licorice root
ai.remedies.fever=cold compress,hydration,rest
ai.remedies.headache=cold compress,dark room,hydration
ai.remedies.stomach-ache=ginger tea,peppermint,heating pad

# Logging
logging.level.com.healthcare.ai=DEBUG
logging.level.org.springframework.data.mongodb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/ai-symptom-service.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.logback.rollingpolicy.max-history=30

# Service URLs (for inter-service communication)
services.auth.url=http://localhost:8081
services.patient.url=http://localhost:8082
services.doctor.url=http://localhost:8083
services.appointment.url=http://localhost:8084

# WebClient Configuration
webclient.connect-timeout=5000
webclient.read-timeout=15000
webclient.write-timeout=5000
webclient.max-in-memory-size=1048576

# Caching Configuration (for performance)
spring.cache.type=simple
spring.cache.cache-names=symptoms,conditions,recommendations
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# Rate Limiting
ai.rate-limit.enabled=true
ai.rate-limit.requests-per-minute=30
ai.rate-limit.requests-per-day=500
ai.rate-limit.burst-capacity=10

# Async Processing
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=ai-processor-

# Validation
spring.mvc.validation.enabled=true
ai.validation.min-symptom-length=3
ai.validation.max-symptoms=15
ai.validation.max-description-length=500

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.metrics.export.prometheus.enabled=false

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*,Authorization,Content-Type
cors.allow-credentials=true
cors.max-age=3600

# Feature Flags
ai.features.enable-symptom-checker=true
ai.features.enable-specialist-referral=true
ai.features.enable-home-remedies=true
ai.features.enable-emergency-detection=true
ai.features.enable-history-tracking=true
ai.features.enable-feedback-learning=false

# Privacy & Compliance
ai.compliance.gdpr.enabled=true
ai.compliance.hipaa.enabled=true
ai.compliance.anonymize-data=true
ai.compliance.retention-days=180
ai.compliance.audit-logging.enabled=true

# Batch Processing
ai.batch.processing.enabled=false
ai.batch.symptom-analysis.rate=100
ai.batch.chunk-size=50
ai.batch.schedule.cron=0 0 2 * * *

# Response Configuration
ai.response.include-confidence=true
ai.response.include-disclaimer=true
ai.response.include-similar-conditions=true
ai.response.max-recommendations=3
ai.response.disclaimer-text=This is an AI-generated recommendation and not a substitute for professional medical advice. Please consult a healthcare provider for proper diagnosis.

# Model Training (Optional - for ML models)
ai.model.training.enabled=false
ai.model.training.data-path=/data/training
ai.model.training.epochs=100
ai.model.training.batch-size=32
ai.model.training.learning-rate=0.001
ai.model.training.validation-split=0.2

# Natural Language Processing
ai.nlp.language=en
ai.nlp.tokenizer.type=simple
ai.nlp.stopwords.enabled=true
ai.nlp.stemming.enabled=true
ai.nlp.synonym-matching.enabled=true
ai.nlp.synonym-database.path=/data/synonyms.json

# Symptom Relationships
ai.relationships.symptom-disease.min-confidence=0.6
ai.relationships.symptom-symptom.correlation-threshold=0.5
ai.relationships.temporal.patterns.enabled=true

# API Keys for External Services (if using)
# rapidapi.symptom-checker.key=your-rapidapi-key
# rapidapi.symptom-checker.host=symptom-checker.p.rapidapi.com
# medlineplus.api.key=your-api-key

# Development-specific settings
spring.profiles.active=default
spring.dev.tools.restart.enabled=true
spring.dev.tools.livereload.enabled=true

# Docker-specific overrides (for production)
# spring.data.mongodb.host=mongo-ai