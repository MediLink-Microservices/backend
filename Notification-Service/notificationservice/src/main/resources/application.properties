# Server Configuration
server.port=8087
server.servlet.context-path=/
server.tomcat.threads.max=100

# Spring Application Name
spring.application.name=notification-service

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27022
spring.data.mongodb.database=notification_db
spring.data.mongodb.authentication-database=admin

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-specific-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email Templates
notification.email.templates.path=/templates/email/
notification.email.from=noreply@healthcare.com
notification.email.from-name=Healthcare System

# SMS Configuration (Twilio)
twilio.account-sid=ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
twilio.auth-token=your_auth_token
twilio.phone-number=+1234567890

# Alternative: AWS SNS Configuration
# cloud.aws.region=us-east-1
# cloud.aws.credentials.access-key=your_access_key
# cloud.aws.credentials.secret-key=your_secret_key

# Alternative: Vonage/Nexmo
# vonage.api-key=your_api_key
# vonage.api-secret=your_api_secret
# vonage.from-number=+1234567890

# SMS Providers Priority
notification.sms.provider=twilio
notification.sms.fallback-provider=none

# Business Rules
notification.queue.enabled=true
notification.queue.capacity=10000
notification.batch.size=100
notification.retry.max-attempts=5
notification.retry.delay-ms=1000

# Rate Limiting
notification.rate-limit.enabled=true
notification.rate-limit.email-per-minute=10
notification.rate-limit.sms-per-minute=5

# Logging
logging.level.com.healthcare.notification=DEBUG
logging.level.org.springframework.mail=INFO
logging.file.name=logs/notification-service.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# Service URLs
services.auth.url=http://localhost:8081
services.appointment.url=http://localhost:8084

# Templates
notification.sms.templates.appointment-reminder=Your appointment with Dr. {doctor} is at {time} on {date}. Room: {room}
notification.sms.templates.payment-confirmation=Payment of {amount} for appointment on {date} was successful. Transaction ID: {transactionId}
notification.sms.templates.appointment-cancellation=Your appointment on {date} has been cancelled. Reason: {reason}

# Email Templates
notification.email.templates.appointment-confirmation=appointment-confirmation.html
notification.email.templates.payment-receipt=payment-receipt.html
notification.email.templates.prescription-uploaded=prescription-uploaded.html

# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=25
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=notification- 

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always