# Server Configuration
server.port=8086
server.servlet.context-path=/
server.compression.enabled=true

# Spring Application Name
spring.application.name=telemedicine-service

# MongoDB Configuration (optional - for room persistence)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27023
spring.data.mongodb.database=telemedicine_db
spring.data.mongodb.authentication-database=admin

# Jitsi Meet Configuration
jitsi.server.url=https://meet.jit.si
jitsi.server.api-url=https://api.jitsi.meet
jitsi.room.prefix=healthcare
jitsi.room.password-enabled=true
jitsi.room.default-password-length=8
jitsi.room.expiry-minutes=60

# Alternative: Twilio Video
# twilio.video.account-sid=ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# twilio.video.auth-token=your_auth_token
# twilio.video.api-key=your_api_key
# twilio.video.api-secret=your_api_secret

# Alternative: Zoom Video
# zoom.api.key=your_zoom_api_key
# zoom.api.secret=your_zoom_api_secret
# zoom.jwt.expiry-seconds=3600

# Room Configuration
video.room.type=group
video.room.max-participants=10
video.room.enable-recording=false
video.room.enable-livestreaming=false
video.room.screen-sharing=true
video.room.chat-enabled=true

# Security
video.room.require-authentication=true
video.room.token-expiry-minutes=30
video.room.signaling.enabled=true

# Quality Settings
video.quality.resolution=720p
video.quality.frame-rate=30
video.quality.bitrate=1500

# Logging
logging.level.com.healthcare.telemedicine=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Service URLs
services.appointment.url=http://localhost:8084
services.auth.url=http://localhost:8081

# WebSocket Configuration (for real-time updates)
spring.websocket.enabled=true
spring.websocket.path=/ws

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS
video.cors.allowed-origins=http://localhost:3000,http://localhost:8080
video.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# Recording (if enabled)
video.recording.storage-path=/recordings
video.recording.format=mp4
video.recording.retention-days=30

# Callback URLs
video.callback.on-room-created=http://localhost:8084/video/callback/room-created
video.callback.on-participant-joined=http://localhost:8084/video/callback/participant-joined
video.callback.on-room-ended=http://localhost:8084/video/callback/room-ended