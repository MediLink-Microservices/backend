# Server Configuration
server.port=8082
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# Spring Application Name
spring.application.name=patient-service

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27018
spring.data.mongodb.database=patient_db
spring.data.mongodb.authentication-database=admin

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.location=/tmp

# Logging
logging.level.com.healthcare.patient=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.file=logs/patient-service.log
logging.file.name=logs/patient-service.log

# Service URLs (for inter-service communication)
services.auth.url=http://localhost:8081
services.doctor.url=http://localhost:8083
services.appointment.url=http://localhost:8084

# WebClient Configuration
webclient.connect-timeout=5000
webclient.read-timeout=10000
webclient.write-timeout=5000

# Validation
spring.mvc.validation.enabled=true

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=false

# CORS Configuration (if needed)
cors.allowed-origins=http://localhost:3000,http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*,Authorization
cors.allow-credentials=true